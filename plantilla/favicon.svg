<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Icono de la pestaña: pastel de dos pisos con una vela. Formas grandes y simples
       para que se reconozca a 16 px. Los marcadores de color (ej. ACCENT entre llaves dobles)
       los rellena preparar-sitio.ps1 con los colores del tema elegido (leídos de tokens.css). -->
  <!-- vela y llama -->
  <rect x="29" y="11" width="6" height="13" rx="2" fill="{{PAPER}}"/>
  <rect x="29" y="14" width="6" height="3" fill="{{MINT}}"/>
  <rect x="29" y="20" width="6" height="3" fill="{{MINT}}"/>
  <path d="M32 1 C37 7 36 10 32 11 C28 10 27 7 32 1 Z" fill="{{MARIGOLD}}"/>
  <!-- piso de arriba con glaseado que gotea -->
  <rect x="13" y="23" width="38" height="16" rx="4" fill="{{ACCENT}}"/>
  <rect x="13" y="23" width="38" height="5" rx="2.5" fill="{{FROSTING_2}}"/>
  <circle cx="19" cy="28" r="2.6" fill="{{FROSTING_2}}"/>
  <circle cx="28" cy="29" r="2.6" fill="{{FROSTING_2}}"/>
  <circle cx="37" cy="28" r="2.6" fill="{{FROSTING_2}}"/>
  <circle cx="45" cy="29" r="2.6" fill="{{FROSTING_2}}"/>
  <!-- piso de abajo con glaseado que gotea -->
  <rect x="5" y="38" width="54" height="20" rx="4" fill="{{ACCENT_DEEP}}"/>
  <rect x="5" y="38" width="54" height="5" rx="2.5" fill="{{PAPER}}"/>
  <circle cx="11" cy="44" r="2.8" fill="{{PAPER}}"/>
  <circle cx="21" cy="45" r="2.8" fill="{{PAPER}}"/>
  <circle cx="32" cy="44" r="2.8" fill="{{PAPER}}"/>
  <circle cx="43" cy="45" r="2.8" fill="{{PAPER}}"/>
  <circle cx="53" cy="44" r="2.8" fill="{{PAPER}}"/>
  <!-- plato -->
  <rect x="1" y="57" width="62" height="5" rx="2.5" fill="{{PLATE}}"/>
</svg>
